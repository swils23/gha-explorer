[project]
name = "gha-explorer"
version = "0.1.0"
description = "A terminal UI for exploring GitHub Actions workflow timing trends"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0,<9",
    "plotext>=5.3.2,<6",
    "rich>=13.0.0",
]
keywords = ["github-actions", "ci", "tui", "textual"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/swils23/gha-explorer"

[project.scripts]
gha-explorer = "gha_explorer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["gha_explorer.py"]

[tool.hatch.build.targets.sdist]
only-include = ["gha_explorer.py", "README.md", "LICENSE", "pyproject.toml"]
